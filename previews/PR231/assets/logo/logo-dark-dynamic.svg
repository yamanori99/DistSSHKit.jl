            </g>
      </g>
    </g>
  </g>

  <!-- ===== Master ===== -->
  <g transform="translate(120, 184)">
    <use href="#dark-master-body"/>
    <g transform="translate(0, -6)">
      <!-- Send spin (~3 ぐるん), then nested run spin with remotes (~3 more) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0 0;360 0 0;720 0 0;1080 0 0"
          keyTimes="0;0.33;0.66;1"
          calcMode="spline"
          keySplines="0.2 0.05 0.25 1; 0.2 0.05 0.25 1; 0.2 0.05 0.25 1"
          begin="2.4s" dur="2.1s" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 0 0;360 0 0;720 0 0;1080 0 0"
            keyTimes="0;0.33;0.66;1"
            calcMode="spline"
            keySplines="0.2 0.05 0.25 1; 0.2 0.05 0.25 1; 0.2 0.05 0.25 1"
            begin="4.7s" dur="1.8s" fill="freeze"/>
          <use href="#dark-master-dots"/>
