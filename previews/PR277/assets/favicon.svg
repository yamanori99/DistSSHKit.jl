<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -24 72 72" width="72" height="72">
  <!-- Parent from logo-static. `#juliadot-lg` at y=-6, scaled 1.15. -->
  <defs>
<style>
      .stroke {
        fill: none;
        stroke: #1a1d21;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .link {
        stroke: #1a1d21;
        stroke-width: 1.4;
        stroke-linecap: round;
        fill: none;
      }
    </style>
    <g id="master-body">
      <rect class="stroke" x="-32" y="-25" width="64" height="36" rx="4"/>
      <!-- stem meets bottom bezel (y=11); start at 12 so round cap stays in stroke, not screen -->
      <line class="stroke" x1="0" y1="12" x2="0" y2="22"/>
      <line class="stroke" x1="-21" y1="24" x2="21" y2="24"/>
    </g>
    <g id="juliadot-lg">
      <!-- Master: Luxor juliacircles R=6.2, r=0.75R -->
      <circle cx="0" cy="-6.2" r="4.65" fill="#cb3c33"/>
      <circle cx="-5.369" cy="3.1" r="4.65" fill="#389826"/>
      <circle cx="5.369" cy="3.1" r="4.65" fill="#9558b2"/>
    </g>
  </defs>
  <use href="#master-body"/>
  <g transform="translate(0,-6) scale(1.15)">
    <use href="#juliadot-lg"/>
  </g>
</svg>
