# Commands measured by bench/compile/measure.jl. No SSH.
# `{work}` is a fresh copy of bench/compile/fixtures. `{store}` is a fresh jobs file.
# The process cwd is that directory.
package = "DistSSHKit"

[[command]]
name = "help"
args = ["--help"]

[[command]]
name = "status"
args = ["status"]

[command.env]
# A runner has no `setup`. Without this, `status` exits 1.
DISTSSHQUEUE_LOCAL = "1"
DISTSSHQUEUE_NO_AUTOSERVE = "1"
DISTSSHQUEUE_STORE = "{store}"

[[command]]
name = "go"
args = ["go", "{work}/pi_echo.jl"]

[[command]]
name = "drive"
args = ["drive", "parent:2", "{work}/drive_square.jl"]
