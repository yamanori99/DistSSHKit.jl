# Commands measured by bench/compile/measure.jl. No SSH.
# `{store}` is a temporary jobs file created for the run.
package = "DistSSHKit"

[[command]]
name = "help"
args = ["--help"]

[[command]]
name = "status"
args = ["status"]

[command.env]
# A runner has no `setup`. Without this, `status` exits 1.
DISTSSHQUEUE_LOCAL = "1"
DISTSSHQUEUE_NO_AUTOSERVE = "1"
DISTSSHQUEUE_STORE = "{store}"
