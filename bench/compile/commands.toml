# Commands measured by bench/compile/measure.jl. No SSH.
# Scripts live under bench/compile/fixtures. Child cwd is the repo root so the
# CLI project root matches the Manifest (worker environment verification).
# `{store}` is a fresh jobs file when a command needs it.
package = "DistSSHKit"

[[command]]
name = "help"
args = ["--help"]

[[command]]
name = "status"
args = ["status"]

[command.env]
# A runner has no `setup`. Without this, `status` exits 1.
DISTSSHQUEUE_LOCAL = "1"
DISTSSHQUEUE_NO_AUTOSERVE = "1"
DISTSSHQUEUE_STORE = "{store}"

[[command]]
name = "go"
args = ["go", "bench/compile/fixtures/pi_echo.jl"]

[[command]]
name = "drive"
args = ["drive", "--head-workers", "2", "bench/compile/fixtures/drive_square.jl"]
