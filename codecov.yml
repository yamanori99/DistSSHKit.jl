coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# GitHub emails every subscriber when Codecov posts a *new* PR comment.
comment: false

# Pkg.test (flag pkgtest) uploads on main push (Ubuntu 1.13 only).
# Carryforward: docs-only PRs skip heavy CI and would otherwise drop line hits.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: pkgtest
      carryforward: true

# No `ignore` list: CLI entry points stay in coverage reports.
