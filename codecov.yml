coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# GitHub emails every subscriber when Codecov posts a *new* PR comment.
comment: false

# Pkg.test (flag pkgtest) uploads on main push (Ubuntu 1.13 only).
# Carry forward pkgtest only. Other flags (the old e2e) must not linger.
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: pkgtest
      carryforward: true

# No `ignore` list: CLI entry points stay in coverage reports.
