coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# GitHub emails every subscriber when Codecov posts a *new* PR comment.
comment: false

# Pkg.test (flag pkgtest) uploads on main push (max slot only).
# E2E (flag e2e) uploads on E2E daily and cut PRs — not ordinary PR E2E.
# Carryforward: docs-only PRs skip heavy CI and would otherwise drop line hits.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: pkgtest
      carryforward: true
    - name: e2e
      carryforward: true

# No `ignore` list: CLI entry points stay in coverage reports.
# Local drive: Pkg.test integration. Remote SSH: E2E job `--code-coverage`.
