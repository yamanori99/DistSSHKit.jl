# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Used from the PR head branch. https://docs.coderabbit.ai/getting-started/yaml-configuration
language: en-US
tone_instructions: >
  Brief. Follow REVIEW.md. Inline comments only for bugs or regressions
  in this diff. Stay inside the PR's stated scope. Start with the count
  of findings. Say when there is nothing to fix.
# Reviews and chat run only after a mention. `@coderabbitai review` is
# incremental. `@coderabbitai full review` starts over. A later push does
# not review again. This file is read from the pull request head.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true
  sequence_diagrams: true
  changed_files_summary: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: false
  path_instructions:
    - path: "**/*.jl"
      instructions: >
        Apply REVIEW.md. `~` expansion belongs to _remote_shell_path_word.
        Flag a remote shell string that interpolates a value without
        _remote_sh_quote or _remote_shell_path_word. Flag delete, prune,
        and teardown path calculations in this diff. Cite a file and line.
        Stay inside the PR's stated scope.
  auto_review:
    enabled: false
    drafts: false
    auto_incremental_review: false
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
chat:
  auto_reply: false
