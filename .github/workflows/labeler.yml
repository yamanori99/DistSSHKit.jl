# Auto-label PRs from changed paths (.github/labeler.yml).
# labeler.yml is generated by .github/gen-labeler.sh from src/cli/<area>/.
#
# `sync-labels: true` uses setLabels. Concurrent Type can add `cut` /
# `uncut` after labeler's snapshot; the write then drops it. Restore
# non-area labels after.
name: Labels

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: area labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check labeler.yml is generated
        run: ./.github/gen-labeler.sh --check

      - name: Snapshot non-area labels
        uses: actions/github-script@v9
        id: snap
        with:
          script: |
            const { data } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const keep = data
              .map((l) => l.name)
              .filter((n) => !n.startsWith("area:"));
            core.setOutput("keep", keep.join(","));

      - uses: actions/labeler@v7
        with:
          sync-labels: true

      - name: Restore type and cut/uncut labels
        uses: actions/github-script@v9
        with:
          script: |
            const n = context.issue.number;
            const snap = `${{ steps.snap.outputs.keep }}`
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);

            async function listNames() {
              const { data } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
              });
              return data.map((l) => l.name);
            }

            const current = await listNames();
            const want = new Set([
              ...snap,
              ...current.filter((name) => !name.startsWith("area:")),
            ]);

            async function versionAt(ref) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: "Project.toml",
                  ref,
                });
                if (data.encoding !== "base64" || typeof data.content !== "string") {
                  return null;
                }
                const text = Buffer.from(data.content, "base64").toString("utf8");
                const m = text.match(/^version\s*=\s*"([^"]+)"/m);
                return m ? m[1] : null;
              } catch (err) {
                core.info(`Project.toml at ${ref}: ${err.message}`);
                return null;
              }
            }

            function parseVer(s) {
              const m = String(s || "").match(/^(\d+)\.(\d+)\.(\d+)/);
              return m
                ? { major: Number(m[1]), minor: Number(m[2]), patch: Number(m[3]) }
                : null;
            }

            function isVersionCut(oldS, newS) {
              const oldV = parseVer(oldS);
              const newV = parseVer(newS);
              if (!oldV || !newV) return false;
              if (newV.major !== oldV.major) return newV.major > oldV.major;
              if (newV.minor !== oldV.minor) return newV.minor > oldV.minor;
              return newV.patch > oldV.patch;
            }

            function isVersionUncut(oldS, newS) {
              return isVersionCut(newS, oldS);
            }

            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            const oldS = await versionAt(base);
            const newS = await versionAt(head);
            if (isVersionCut(oldS, newS)) {
              want.add("cut");
              want.delete("uncut");
            } else if (isVersionUncut(oldS, newS)) {
              want.add("uncut");
              want.delete("cut");
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: n,
                  name,
                });
                core.info(`Removed label "${name}"`);
              } catch (err) {
                if (err.status !== 404) {
                  throw err;
                }
              }
            }

            for (const name of ["cut", "uncut"]) {
              if (current.includes(name) && !want.has(name)) {
                await removeLabel(name);
              }
            }

            const missing = [...want].filter((name) => !current.includes(name));
            if (missing.length === 0) {
              core.info("non-area labels intact");
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              labels: missing,
            });
            core.info(`Restored: ${missing.join(", ")}`);
