# Auto-label PRs from changed paths (.github/labeler.yml).
# labeler.yml is generated by .github/gen-labeler.sh from src/cli/<area>/.
#
# `sync-labels: true` uses setLabels. Restore non-area labels after so a
# concurrent Type job is not wiped. Type's concurrency group includes
# event.action, so labeled/unlabeled from this job does not cancel an
# in-flight opened/synchronize Type run.
#
# pull_request_target runs this file from the base branch, so fork PRs
# do not exercise this change until it is merged. This job does not
# check out the pull request head or run code from it. With no checkout,
# actions/labeler loads .github/labeler.yml from the base SHA via the
# API (github.sha). gen-labeler.sh --check stays on pull_request in
# labeler-check.yml.
name: Labels

on: # zizmor: ignore[dangerous-triggers] API label writes only; no checkout of the PR head
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Separate from labeler-check so the read-only drift job cannot cancel
# an in-flight label write. Group name matches the previous workflow lock.
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: area labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Area rules
        id: areas
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".github/labeler.yml",
              ref: context.sha,
            });
            if (!data || Array.isArray(data) || !data.content) {
              throw new Error(".github/labeler.yml was not a file at the base SHA");
            }
            const text = Buffer.from(data.content, "base64").toString("utf8");
            const run = /^"area:/m.test(text);
            core.info(run ? "area rules present" : "no area rules; skip actions/labeler");
            core.setOutput("run", run ? "true" : "false");

      - name: Snapshot non-area labels
        if: steps.areas.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: snap
        with:
          script: |
            const { data } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const keep = data
              .map((l) => l.name)
              .filter((n) => !n.startsWith("area:"));
            core.setOutput("keep", keep.join(","));

      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: steps.areas.outputs.run == 'true'
        with:
          sync-labels: true

      - name: Restore non-area labels
        if: steps.areas.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEEP_LABELS: ${{ steps.snap.outputs.keep }}
        with:
          script: |
            const n = context.issue.number;
            const snap = (process.env.KEEP_LABELS || "")
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);

            async function listNames() {
              const { data } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: n,
              });
              return data.map((l) => l.name);
            }

            const current = await listNames();
            const want = new Set([
              ...snap,
              ...current.filter((name) => !name.startsWith("area:")),
            ]);

            const missing = [...want].filter((name) => !current.includes(name));
            if (missing.length === 0) {
              core.info("non-area labels intact");
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              labels: missing,
            });
            core.info(`Restored: ${missing.join(", ")}`);

      # Add `cut` only when the version rises above the base. A removed
      # label stays off until the next rise. An unreadable `before` does
      # not add the label and does not fail this job. Restore above keeps
      # `cut` when the snapshot had it; sync-labels drops it mid-job.
      # version-cut.sh is the base copy. Project.toml bytes come from the
      # contents API, not a checkout of the head.
      - name: Version cut label
        id: cut
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");

            const base = process.env.BASE;
            const head = process.env.HEAD;
            const before = process.env.BEFORE || "";
            const action = process.env.ACTION || "";
            const pr = process.env.PR;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function finish(now, add) {
              core.setOutput("now", now);
              core.setOutput("add", add ? "true" : "false");
            }

            function decode(data) {
              if (!data || Array.isArray(data) || !data.content) {
                throw new Error("GitHub contents response was not a file");
              }
              return Buffer.from(data.content, "base64").toString("utf8");
            }

            async function fileAt(filePath, ref) {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: filePath,
                ref,
              });
              return decode(data);
            }

            async function projectToml(ref, fallback) {
              try {
                return await fileAt("Project.toml", ref);
              } catch (err) {
                if (!fallback) {
                  throw err;
                }
                core.info(
                  `Project.toml at ${ref} unreadable (${err.status || ""} ${err.message}); trying ${fallback}`,
                );
                return await fileAt("Project.toml", fallback);
              }
            }

            function compare(scriptText, oldText, newText) {
              const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "vcut-"));
              const scriptPath = path.join(dir, "version-cut.sh");
              const oldPath = path.join(dir, "old.toml");
              const newPath = path.join(dir, "new.toml");
              fs.writeFileSync(scriptPath, scriptText);
              fs.writeFileSync(oldPath, oldText);
              fs.writeFileSync(newPath, newText);
              return execFileSync(
                "bash",
                [scriptPath, "--files", oldPath, newPath],
                { encoding: "utf8" },
              ).trim();
            }

            let scriptText;
            let baseToml;
            let now;
            try {
              scriptText = await fileAt(".github/version-cut.sh", base);
              baseToml = await fileAt("Project.toml", base);
              const headToml = await projectToml(head, `refs/pull/${pr}/head`);
              now = compare(scriptText, baseToml, headToml);
            } catch (err) {
              core.info(`head compare failed (${err.message}); leaving cut unchanged`);
              finish("unknown", false);
              return;
            }
            if (now !== "true" && now !== "false") {
              core.info(`head compare returned ${JSON.stringify(now)}; leaving cut unchanged`);
              finish("unknown", false);
              return;
            }

            let add = false;
            if (now === "true" && action === "opened") {
              add = true;
            } else if (now === "true" && action === "synchronize") {
              if (!before) {
                core.info("before is empty; not adding cut");
              } else {
                try {
                  const beforeToml = await fileAt("Project.toml", before);
                  const prev = compare(scriptText, baseToml, beforeToml);
                  if (prev === "true") {
                    core.info("head was already a cut; not adding");
                  } else {
                    add = true;
                  }
                } catch (err) {
                  core.info(`before is unreadable (${err.message}); not adding cut`);
                }
              }
            }
            finish(now, add);

      - name: Apply version cut label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADD: ${{ steps.cut.outputs.add }}
          NOW: ${{ steps.cut.outputs.now }}
        with:
          script: |
            const now = process.env.NOW;
            if (now !== "true" && now !== "false") {
              core.info("cut unchanged");
              return;
            }
            const n = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: n,
            });
            const names = data.map((l) => l.name);
            if (now === "false" && names.includes("cut")) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: n,
                name: "cut",
              });
              core.info("Removed cut");
              return;
            }
            if (process.env.ADD === "true" && !names.includes("cut")) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: n,
                labels: ["cut"],
              });
              core.info("Added cut");
            }
