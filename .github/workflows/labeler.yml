# Auto-label PRs from changed paths (.github/labeler.yml).
# labeler.yml is generated by .github/gen-labeler.sh from src/cli/<area>/.
name: Labeler

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check labeler.yml is generated
        run: ./.github/gen-labeler.sh --check

      - uses: actions/labeler@v5
        with:
          sync-labels: true
