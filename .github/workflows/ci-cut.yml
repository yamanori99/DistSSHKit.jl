# `cut` added after open. Default pull_request types omit `labeled`; keep it
# off Test so area/type labels cannot skip or cancel Pkg.test.
name: Test (cut)

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ci-cut-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches

jobs:
  test-registry-tree:
    # Unique name when skipped so a `bug` label does not overwrite Test's check.
    if: github.event.label.name == 'cut'
    name: ${{ github.event.label.name == 'cut' && 'Pkg.test - registry tree - ubuntu-latest' || 'cut label skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: steps.detect.outputs.heavy == 'true'
        with:
          slot: tip
      - uses: julia-actions/cache@v3
        if: steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - uses: ./.github/actions/registry-tree-test
        if: steps.detect.outputs.heavy == 'true'
