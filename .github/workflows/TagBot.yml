# Present for a future General-registry release. Until then, cut tags manually
# after merge (see CONTRIBUTING.md). Do not rely on TagBot for DistSSHKit releases.
name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Docs deploy via GITHUB_TOKEN (Documentation.yml). Leave DOCUMENTER_KEY
          # unset unless you need TagBot-created tags to trigger other workflows.
          # ssh: ${{ secrets.DOCUMENTER_KEY }}
