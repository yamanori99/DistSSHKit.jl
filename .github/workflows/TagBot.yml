# TagBot creates `vX.Y.Z` tags after General-registry releases (JuliaTagBot /
# workflow_dispatch). Manual `git tag -a` remains fine for maintainer overrides;
# see CONTRIBUTING.md.
name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Docs deploy via GITHUB_TOKEN (Documentation.yml). Leave DOCUMENTER_KEY
          # unset unless you need TagBot-created tags to trigger other workflows.
          # ssh: ${{ secrets.DOCUMENTER_KEY }}
