name: Docs

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  filter:
    name: skip if root markdown
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect

  build:
    needs: filter
    name: Documenter - Julia 1.12 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Documenter hosting template: push docs + report documenter/deploy status.
      contents: write
      statuses: write
      actions: write
      pull-requests: read
    steps:
      - name: Skip
        if: needs.filter.outputs.heavy != 'true'
        run: echo "Root markdown only; Documenter skipped."
      - uses: actions/checkout@v7
        if: needs.filter.outputs.heavy == 'true'
      - uses: julia-actions/setup-julia@v3
        if: needs.filter.outputs.heavy == 'true'
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        if: needs.filter.outputs.heavy == 'true'
      - name: Install docs dependencies
        if: needs.filter.outputs.heavy == 'true'
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.instantiate()
          '
      - name: Doctests
        if: needs.filter.outputs.heavy == 'true'
        run: |
          julia --project=docs -e '
            using Documenter, DistSSHKit, Test
            DocMeta.setdocmeta!(DistSSHKit, :DocTestSetup, :(using DistSSHKit); recursive=true)
            doctest(DistSSHKit)
          '
      - name: Build and deploy
        if: needs.filter.outputs.heavy == 'true'
        env:
          # Deploy via HTTPS + contents:write (no DOCUMENTER_KEY SSH secret required).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs --color=yes docs/make.jl
