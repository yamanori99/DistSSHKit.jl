name: Docs

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  # Manual rebuild (e.g. `gh workflow run Docs --ref v0.3.0`) if a tag skipped Docs.
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
      docs: ${{ steps.heavy.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: heavy

  build:
    name: Documenter - min - ubuntu-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true' || needs.detect.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Documenter hosting template: push docs + report documenter/deploy status.
      contents: write
      statuses: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          slot: min
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.instantiate()
          '
      - name: Doctests
        run: |
          julia --project=docs -e '
            using Documenter, DistSSHKit, Test
            DocMeta.setdocmeta!(DistSSHKit, :DocTestSetup, :(using DistSSHKit); recursive=true)
            doctest(DistSSHKit)
          '
      - name: Build and deploy
        env:
          # Deploy via HTTPS + contents:write (no DOCUMENTER_KEY SSH secret required).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs --color=yes docs/make.jl
      - name: Commit PkgEval badge if Nanosoldier changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/src/assets/pkgeval.svg
          if git diff --cached --quiet; then
            echo "PkgEval badge unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh PkgEval badge from Nanosoldier."
            git pull --rebase origin main
            git push
          fi
