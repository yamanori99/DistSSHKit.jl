name: Docs

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  # Manual rebuild (e.g. `gh workflow run Docs --ref v0.3.0`) if a tag skipped Docs.
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    name: Documenter - min - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Documenter hosting template: push docs + report documenter/deploy status.
      contents: write
      statuses: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: min
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - name: Install docs dependencies
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.instantiate()
          '
      - name: Doctests
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: |
          julia --project=docs -e '
            using Documenter, DistSSHKit, Test
            DocMeta.setdocmeta!(DistSSHKit, :DocTestSetup, :(using DistSSHKit); recursive=true)
            doctest(DistSSHKit)
          '
      - name: Build and deploy
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        env:
          # Deploy via HTTPS + contents:write (no DOCUMENTER_KEY SSH secret required).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs --color=yes docs/make.jl
