name: E2E weekly

# Not on pull_request: skipped macOS/WSL jobs would show on every PR, and
# job-name expressions do not expand when skipped.
on:
  workflow_dispatch:
  # Sunday 04:00 JST (Saturday 19:00 UTC). Misses CI weekly (Sunday 10:00 JST).
  # GitHub often delays cron; start early so it still finishes before morning.
  schedule:
    - cron: "0 19 * * 6"

concurrency:
  group: ssh-e2e-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches

jobs:
  linux-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest (image)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh build + push
        env:
          DISTSSHKIT_PUSH_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshkit-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_SKIP_UP: "1"
        run: ./testenv/docker-ssh/scripts/up.sh
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  linux-e2e:
    needs: linux-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest → ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write # Codecov OIDC (E2E coverage; not on PR E2E)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          slot: max
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh up + SSH E2E
        id: e2e
        env:
          DISTSSHKIT_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshkit-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_WORKER_PULL_RETRIES: "8"
          DISTSSHKIT_CODE_COVERAGE: "1"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - uses: ./.github/actions/e2e-codecov
        if: ${{ always() && steps.e2e.outcome == 'success' }}
      # SHA from the image job; latest after this Linux suite (package should be public).
      - name: Push latest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/distsshkit-linux-ssh-worker
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" local/linux-ssh-worker:latest
          ./testenv/docker-ssh/scripts/push-image.sh "${IMAGE}:latest"
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  macos-e2e:
    needs: linux-image
    runs-on: macos-15-intel
    timeout-minutes: 60
    name: macos-15-intel → ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          slot: max
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Colima
        run: ./testenv/docker-ssh/scripts/setup-colima-ci.sh
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHKIT_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshkit-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_WORKER_PULL_RETRIES: "8"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  wsl-e2e:
    needs: linux-image
    runs-on: windows-latest
    timeout-minutes: 60
    name: windows-latest (WSL2) → ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: >-
            ca-certificates curl git rsync openssh-client
            docker.io docker-compose-v2 iptables
      - uses: actions/cache@v6
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-max-${{ hashFiles('Project.toml', 'test/Project.toml') }}
      - name: GHCR token for WSL
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p .ci-cache
          printf '%s' "$GHCR_TOKEN" > .ci-cache/ghcr.token
      # wsl-bash does not inherit Actions env (set -u → unbound GITHUB_TOKEN).
      - name: docker-ssh up + SSH E2E in WSL2
        shell: wsl-bash {0}
        run: |
          src="$(pwd)"
          dest="$HOME/DistSSHKit.jl"
          cache="$src/.ci-cache/wsl-julia"
          export DISTSSHKIT_WORKER_IMAGE="ghcr.io/${{ github.repository_owner }}/distsshkit-linux-ssh-worker:${{ github.sha }}"
          export DISTSSHKIT_WORKER_PULL_RETRIES="8"
          mkdir -p "$cache"
          rm -rf "$dest"
          git clone "$src" "$dest"
          if ! docker info >/dev/null 2>&1; then
            dockerd >/tmp/dockerd.log 2>&1 &
            ok=0
            for _ in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [[ "$ok" -ne 1 ]]; then
              cat /tmp/dockerd.log
              exit 1
            fi
          fi
          echo "$(cat "$src/.ci-cache/ghcr.token")" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          rm -f "$src/.ci-cache/ghcr.token"
          if [[ -f "$cache/julia.tgz" ]]; then
            tar -xzf "$cache/julia.tgz" -C "$HOME"
          else
            curl --retry 5 --retry-delay 5 --retry-connrefused --connect-timeout 10 \
              -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.13
            # Channel must match JULIA_SLOT_MAX (E2E pair) in .github/julia-slots.env
          fi
          export PATH="$HOME/.juliaup/bin:$PATH"
          cd "$dest"
          ./testenv/docker-ssh/scripts/up.sh --e2e
          if [[ -d "$HOME/.julia" ]]; then
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup .julia
          else
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup
          fi
      - name: Teardown workers
        if: always()
        shell: wsl-bash {0}
        run: |
          src="$(pwd)"
          rm -f "$src/.ci-cache/ghcr.token"
          dest="$HOME/DistSSHKit.jl"
          if [[ -d "$dest" ]]; then
            (cd "$dest" && ./testenv/docker-ssh/scripts/down.sh) || true
          fi

  # Schedule runs are not PR checks, and github-actions[bot] does not email.
  notify:
    needs: [linux-image, linux-e2e, macos-e2e, wsl-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ contains(join(needs.*.result, ','), 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='E2E weekly failed'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ "$FAILED" = "true" ]; then
            body="Latest run: $RUN_URL

          Not a PR check (Linux / macOS / WSL are schedule-only). Re-run **E2E weekly** after a fix."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label ci --body "$body"
            fi
          else
            for t in 'E2E weekly failed' 'E2E daily failed'; do
              n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci --search "in:title $t" --json number --jq '.[0].number // empty')"
              if [ -n "$n" ]; then
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Latest run succeeded: $RUN_URL"
              fi
            done
          fi
