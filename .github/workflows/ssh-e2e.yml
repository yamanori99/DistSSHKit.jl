name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ssh-e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  filter:
    name: detect e2e paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      e2e: ${{ steps.gate.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          filters: |
            e2e:
              - "src/**"
              - "test/**"
              - "demos/**"
              - "testenv/**"
              - "Project.toml"
              - ".github/workflows/ssh-e2e.yml"
      - id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=${{ steps.filter.outputs.e2e }}" >> "$GITHUB_OUTPUT"
          fi

  ssh-e2e:
    needs: filter
    if: needs.filter.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest → ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: "1.12"
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        run: julia --version

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - name: docker-ssh up + SSH E2E
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true
