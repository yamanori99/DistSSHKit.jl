name: E2E

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "demos/**"
      - "testenv/docker-ssh/**"
      - ".github/workflows/ssh-e2e.yml"
      - "Project.toml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "demos/**"
      - "testenv/docker-ssh/**"
      - ".github/workflows/ssh-e2e.yml"
      - "Project.toml"
  workflow_dispatch:

concurrency:
  group: ssh-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  ssh-e2e:
    # Linux controller → Linux Docker workers only.
    # macOS controllers: run the same suite locally (`./scripts/up.sh --e2e`).
    # Colima on macos-15-intel made PR feedback too slow (~25m+).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: SSH
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - name: docker-ssh up + SSH E2E
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # WSL2 Ubuntu controller → Linux Docker workers. Merge / dispatch only (same
  # idea as a post-merge macOS→Linux job: too heavy for PR feedback).
  wsl-e2e:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    name: WSL2 (Windows)
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: >-
            ca-certificates curl git rsync openssh-client
            docker.io docker-compose-v2 iptables
      - name: docker-ssh up + SSH E2E in WSL2
        shell: wsl-bash {0}
        run: |
          src="$(pwd)"
          dest="$HOME/DistSSHKit.jl"
          rm -rf "$dest"
          git clone "$src" "$dest"
          if ! docker info >/dev/null 2>&1; then
            dockerd >/tmp/dockerd.log 2>&1 &
            ok=0
            for _ in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [[ "$ok" -ne 1 ]]; then
              cat /tmp/dockerd.log
              exit 1
            fi
          fi
          curl --retry 5 --retry-delay 5 --retry-connrefused --connect-timeout 10 \
            -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12
          export PATH="$HOME/.juliaup/bin:$PATH"
          cd "$dest"
          ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        shell: wsl-bash {0}
        run: |
          dest="$HOME/DistSSHKit.jl"
          if [[ -d "$dest" ]]; then
            (cd "$dest" && ./testenv/docker-ssh/scripts/down.sh) || true
          fi
