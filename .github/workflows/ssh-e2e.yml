name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ssh-e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  id-token: write # Codecov OIDC (E2E .cov merge with Pkg.test)
  actions: write # julia-actions/cache delete-old-caches

jobs:
  ssh-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest → ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          filters: |
            e2e:
              - "src/**"
              - "test/**"
              - "demos/**"
              - "testenv/**"
              - "Project.toml"
              - ".github/workflows/ssh-e2e.yml"
      - id: gate
        env:
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          CUT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'cut') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CUT" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=${FILTER_E2E}" >> "$GITHUB_OUTPUT"
          fi

      - uses: julia-actions/setup-julia@v3
        if: steps.gate.outputs.e2e == 'true'
        id: julia
        with:
          version: "1.12"
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        if: steps.gate.outputs.e2e == 'true'
        run: julia --version

      - uses: julia-actions/cache@v3
        if: steps.gate.outputs.e2e == 'true'

      - uses: julia-actions/julia-buildpkg@v1
        if: steps.gate.outputs.e2e == 'true'

      - name: docker-ssh up + SSH E2E
        id: e2e
        if: steps.gate.outputs.e2e == 'true'
        env:
          DISTSSHKIT_CODE_COVERAGE: "1"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ always() && steps.e2e.outcome == 'success' }}
      - name: Upload E2E coverage to Codecov
        if: ${{ always() && steps.e2e.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true
          flags: e2e
          fail_ci_if_error: false
      - name: E2E coverage summary
        if: ${{ always() && steps.e2e.outcome == 'success' }}
        run: |
          julia --color=no -e '
          using Pkg
          Pkg.add("Coverage")
          using Coverage, Printf
          files = process_folder("src")
          for fc in files
              c, t = get_summary(fc)
              t == 0 && continue
              @printf("%-32s %5.1f%%\n", basename(fc.filename), 100 * c / t)
          end
          c, t = get_summary(files)
          @printf("%-32s %5.1f%%  (%d/%d lines)\n", "TOTAL", 100 * c / t, c, t)
          '

      - name: Teardown workers
        if: ${{ always() && steps.gate.outputs.e2e == 'true' }}
        run: ./testenv/docker-ssh/scripts/down.sh || true
