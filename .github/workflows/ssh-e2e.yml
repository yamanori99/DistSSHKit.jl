name: E2E

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "demos/**"
      - "testenv/docker-ssh/**"
      - ".github/workflows/ssh-e2e.yml"
      - "Project.toml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "demos/**"
      - "testenv/docker-ssh/**"
      - ".github/workflows/ssh-e2e.yml"
      - "Project.toml"
  workflow_dispatch:

concurrency:
  group: ssh-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  ssh-e2e:
    # Linux controller → Linux Docker workers only.
    # macOS controllers: run the same suite locally (`./scripts/up.sh --e2e`).
    # Colima on macos-15-intel made PR feedback too slow (~25m+).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: SSH (Julia 1.12)
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: "1.12"
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        run: julia --version

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - name: docker-ssh up + SSH E2E
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true
