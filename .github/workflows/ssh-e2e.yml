name: SSH E2E

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "demos/**"
      - "testenv/docker-ssh/**"
      - ".github/workflows/ssh-e2e.yml"
      - "Project.toml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "demos/**"
      - "testenv/docker-ssh/**"
      - ".github/workflows/ssh-e2e.yml"
      - "Project.toml"
  workflow_dispatch:

concurrency:
  group: ssh-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  ssh-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux controller → Linux Docker workers (same suite as macOS job).
          - os: ubuntu-latest
            label: linux-to-linux
          # macOS controller → Linux workers (Colima + localhost ports).
          # Same E2E suite: controller path resolve on Darwin + remote auto on Linux.
          # ARM runners lack nested virt; macos-15-intel is the free option (~2027).
          - os: macos-15-intel
            label: macos-to-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: ssh-e2e (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker on macOS (Colima)
        if: runner.os == 'macOS'
        run: ./testenv/docker-ssh/scripts/setup-colima-ci.sh

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - name: docker-ssh up + SSH E2E
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true
