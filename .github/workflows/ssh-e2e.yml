name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # 04:00 JST (UTC 19:00). GitHub often delays cron; start early so it still
  # finishes before morning. macOS / WSL run here, not on every main push.
  schedule:
    - cron: "0 19 * * *"

concurrency:
  group: ssh-e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  paths:
    name: E2E paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      e2e: ${{ steps.out.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          filters: |
            e2e:
              - "src/**"
              - "test/**"
              - "demos/**"
              - "testenv/**"
              - "Project.toml"
              - ".github/workflows/ssh-e2e.yml"
      - id: out
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) echo "e2e=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "e2e=${{ steps.filter.outputs.e2e }}" >> "$GITHUB_OUTPUT" ;;
          esac

  ssh-e2e:
    # Linux controller → Linux Docker workers. Always listed on PR/main so a
    # missed glob cannot hide the check. Suite runs when `paths` says kit code.
    # On schedule / dispatch, also pushes the worker image for macOS / WSL.
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Linux → Linux
    permissions:
      contents: read
      packages: write
    steps:
      - name: Skip suite
        if: needs.paths.outputs.e2e != 'true'
        run: echo "No kit/E2E paths; Linux SSH E2E skipped."

      - uses: actions/checkout@v7
        if: needs.paths.outputs.e2e == 'true'

      - uses: julia-actions/setup-julia@v3
        if: needs.paths.outputs.e2e == 'true'
        id: julia
        with:
          version: "1.12"
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        if: needs.paths.outputs.e2e == 'true'
        run: julia --version

      - uses: julia-actions/cache@v3
        if: needs.paths.outputs.e2e == 'true'

      - uses: julia-actions/julia-buildpkg@v1
        if: needs.paths.outputs.e2e == 'true'

      - name: Log in to GHCR
        if: needs.paths.outputs.e2e == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: docker-ssh up + SSH E2E
        if: needs.paths.outputs.e2e == 'true'
        env:
          DISTSSHKIT_PUSH_IMAGE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('ghcr.io/{0}/distsshkit-linux-ssh-worker:{1}', github.repository_owner, github.sha) || '' }}
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: always() && needs.paths.outputs.e2e == 'true'
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Darwin controller → Linux Docker workers via Colima. Daily schedule /
  # dispatch only (Colima on macos-15-intel is too slow for PR / merge wait).
  macos-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 60
    name: macOS → Linux
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Colima
        run: ./testenv/docker-ssh/scripts/setup-colima-ci.sh
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHKIT_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshkit-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_WORKER_PULL_RETRIES: "40"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # WSL2 Ubuntu controller → Linux Docker workers. Daily schedule / dispatch only.
  wsl-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    name: WSL2 → Linux
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: >-
            ca-certificates curl git rsync openssh-client
            docker.io docker-compose-v2 iptables
      - uses: actions/cache@v4
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.12-${{ hashFiles('Project.toml', 'test/Project.toml') }}
          restore-keys: |
            wsl-julia-1.12-
      - name: docker-ssh up + SSH E2E in WSL2
        shell: wsl-bash {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DISTSSHKIT_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshkit-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_WORKER_PULL_RETRIES: "40"
        run: |
          src="$(pwd)"
          dest="$HOME/DistSSHKit.jl"
          cache="$src/.ci-cache/wsl-julia"
          mkdir -p "$cache"
          rm -rf "$dest"
          git clone "$src" "$dest"
          if ! docker info >/dev/null 2>&1; then
            dockerd >/tmp/dockerd.log 2>&1 &
            ok=0
            for _ in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [[ "$ok" -ne 1 ]]; then
              cat /tmp/dockerd.log
              exit 1
            fi
          fi
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ -f "$cache/julia.tgz" ]]; then
            tar -xzf "$cache/julia.tgz" -C "$HOME"
          else
            curl --retry 5 --retry-delay 5 --retry-connrefused --connect-timeout 10 \
              -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.12
          fi
          export PATH="$HOME/.juliaup/bin:$PATH"
          cd "$dest"
          ./testenv/docker-ssh/scripts/up.sh --e2e
          if [[ -d "$HOME/.julia" ]]; then
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup .julia
          else
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup
          fi
      - name: Teardown workers
        if: always()
        shell: wsl-bash {0}
        run: |
          dest="$HOME/DistSSHKit.jl"
          if [[ -d "$dest" ]]; then
            (cd "$dest" && ./testenv/docker-ssh/scripts/down.sh) || true
          fi
