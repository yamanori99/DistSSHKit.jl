name: Aqua

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: aqua-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches

jobs:
  aqua-min:
    name: Aqua - min - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: min
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - name: Aqua.test_all (latest Aqua)
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: ./.github/aqua-check.sh

  aqua-max:
    name: Aqua - max - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: max
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - name: Aqua.test_all (latest Aqua)
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: ./.github/aqua-check.sh

  aqua-tip:
    name: Aqua - tip - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: tip
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - name: Aqua.test_all (latest Aqua)
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: ./.github/aqua-check.sh
