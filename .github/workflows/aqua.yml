name: Aqua

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: aqua-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches

jobs:
  aqua-1-12:
    name: Aqua - Julia 1.12 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: julia-actions/setup-julia@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
      - name: Aqua.test_all (latest Aqua)
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: ./.github/aqua-check.sh

  aqua-1-13:
    name: Aqua - Julia 1.13 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: julia-actions/setup-julia@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          version: "~1.13.0-0"
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
      - name: Aqua.test_all (latest Aqua)
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: ./.github/aqua-check.sh
