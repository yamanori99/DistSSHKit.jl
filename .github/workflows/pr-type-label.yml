# Require a type label on every PR: bug | enhancement | breaking | chore.
# If missing, infer from the branch prefix and apply it (feat/ → enhancement, …).
# Dependabot PRs are exempt (bot marker: `dependencies` only).
name: PR type label

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-type-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  require-type:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const login = context.payload.pull_request.user.login;
            if (login === "dependabot[bot]") {
              core.info("Skipping type label check for Dependabot");
              return;
            }

            const required = ["bug", "enhancement", "breaking", "chore"];
            const requiredSet = new Set(required);
            const n = context.issue.number;
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            let found = labels.filter((name) => requiredSet.has(name));
            if (found.length > 0) {
              core.info(`Type label(s): ${found.join(", ")}`);
              return;
            }

            const branch = String(context.payload.pull_request.head.ref || "");
            const inferred = inferType(branch);
            if (inferred === null) {
              core.setFailed(
                `No type label and branch "${branch}" does not match feat/ fix/ chore/ docs/ ci/ breaking/. ` +
                  `Rename the branch or add one of: ${required.join(", ")}.`,
              );
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              labels: [inferred],
            });
            core.info(`Applied type label "${inferred}" from branch "${branch}"`);

            function inferType(ref) {
              const b = ref.toLowerCase();
              if (b.startsWith("breaking/") || b.startsWith("break/")) {
                return "breaking";
              }
              if (b.startsWith("feat/") || b.startsWith("feature/")) {
                return "enhancement";
              }
              if (b.startsWith("fix/") || b.startsWith("bug/") || b.startsWith("hotfix/")) {
                return "bug";
              }
              if (
                b.startsWith("chore/") ||
                b.startsWith("docs/") ||
                b.startsWith("ci/") ||
                b.startsWith("build/") ||
                b.startsWith("test/") ||
                b.startsWith("refactor/")
              ) {
                return "chore";
              }
              return null;
            }
