# Require a type label on every PR except a version cut:
# bug | enhancement | breaking | chore.
# If missing, in order: unique type on a closing issue (`Fixes #N`),
# branch prefix (`feat/` → enhancement, `fix/` → bug,
# `breaking/` `break/` → breaking, `chore/` `docs/` `ci/` `test/` → chore),
# Conventional Commit title (`fix:` → bug, `feat:` → enhancement,
# `!` before the colon → breaking, `docs:` `test:` `ci:` `chore:` → chore,
# `type(scope):` accepted), else `chore` when the diff has no `src/`,
# `ext/`, or root `Project.toml`.
# A release cut is identified from the Project.toml version diff and uses
# the orthogonal `cut` label instead. Anything else fails until someone
# adds one of the four type labels.
# Dependabot is exempt (`dependencies`).
# Labels adds `cut` only when the version rises above the base.
# A removed `cut` stays off until the next rise. This workflow does not
# add it. CI still reads Project.toml (version-cut.sh).
name: Type

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

# Include event.action so labeled/unlabeled (from path Labels) do not
# cancel an in-flight opened/synchronize job that is applying the type.
concurrency:
  group: pr-type-label-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  require-type:
    name: PR label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Read the detector from the trusted base revision. Labels runs the same
      # comparison to add `cut`, but this direct check avoids a workflow race.
      - name: Detect version cut
        id: cut
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/version-cut.sh"
          git show "${BASE}:.github/version-cut.sh" > "$script"
          value="$(bash "$script" "$BASE" "$HEAD")"
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION_CUT: ${{ steps.cut.outputs.value }}
        with:
          # 422 on a brand-new PR is often "Could not resolve … global id" (node
          # not visible on the Issues API yet). github-script exempts 422 from
          # its own retries, so this script backs off instead.
          script: |
            const login = context.payload.pull_request.user.login;
            if (login === "dependabot[bot]") {
              core.info("Skipping type label check for Dependabot");
              return;
            }
            if (process.env.VERSION_CUT === "true") {
              core.info("Version cut: the orthogonal cut label replaces a type label");
              return;
            }

            const required = ["bug", "enhancement", "breaking", "chore"];
            const requiredSet = new Set(required);
            const n = context.issue.number;

            async function retryPrNode(fn) {
              let delayMs = 1000;
              const tries = 8;
              for (let i = 1; i <= tries; i++) {
                try {
                  return await fn();
                } catch (err) {
                  const msg = String(err.message || "");
                  const transient =
                    err.status === 422 &&
                    msg.includes("Could not resolve to a node with the global id");
                  if (!transient || i === tries) {
                    throw err;
                  }
                  core.info(
                    `PR node not ready (${i}/${tries}); retry in ${delayMs}ms`,
                  );
                  await new Promise((r) => setTimeout(r, delayMs));
                  delayMs = Math.min(delayMs * 2, 8000);
                }
              }
            }

            async function listLabelNames() {
              try {
                const { data } = await retryPrNode(() =>
                  github.rest.issues.listLabelsOnIssue({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: n,
                  }),
                );
                return data.map((l) => l.name);
              } catch (err) {
                core.warning(
                  `listLabelsOnIssue failed (${err.message}); using event payload`,
                );
                return (context.payload.pull_request.labels || []).map((l) => l.name);
              }
            }

            async function addIssueLabels(names) {
              await retryPrNode(() =>
                github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: n,
                  labels: names,
                }),
              );
            }

            const labels = await listLabelNames();
            let found = labels.filter((name) => requiredSet.has(name));
            if (found.length > 0) {
              core.info(`Type label(s): ${found.join(", ")}`);
            } else {
              const fromIssue = await typeFromClosingIssues(n);
              const branch = String(context.payload.pull_request.head.ref || "");
              const title = String(context.payload.pull_request.title || "");
              let inferred = fromIssue;
              let source = fromIssue !== null ? "a closing issue" : null;
              if (inferred === null) {
                inferred = inferType(branch);
                if (inferred !== null) {
                  source = `branch "${branch}"`;
                }
              }
              if (inferred === null) {
                inferred = inferTitle(title);
                if (inferred !== null) {
                  source = "the pull request title";
                }
              }
              if (inferred === null) {
                inferred = await typeFromChangedFiles(n);
                if (inferred !== null) {
                  source = "changed files";
                }
              }
              if (inferred === null) {
                core.setFailed(
                  "Add one of these labels: bug, enhancement, breaking, chore. Version cuts use cut instead.",
                );
                return;
              }
              await addIssueLabels([inferred]);
              core.info(`Applied type label "${inferred}" from ${source}`);
            }

            async function typeFromClosingIssues(num) {
              const query = `query($owner: String!, $name: String!, $n: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $n) {
                    closingIssuesReferences(first: 20) {
                      nodes { labels(first: 20) { nodes { name } } }
                    }
                  }
                }
              }`;
              const result = await retryPrNode(() =>
                github.graphql(query, {
                  owner: context.repo.owner,
                  name: context.repo.repo,
                  n: num,
                }),
              );
              const nodes =
                result.repository?.pullRequest?.closingIssuesReferences?.nodes ?? [];
              const types = new Set();
              for (const node of nodes) {
                for (const lab of node.labels?.nodes ?? []) {
                  if (requiredSet.has(lab.name) && lab.name !== "breaking") {
                    types.add(lab.name);
                  }
                }
              }
              if (types.size === 1) {
                return [...types][0];
              }
              return null;
            }

            function inferType(ref) {
              const b = ref.toLowerCase();
              if (b.startsWith("breaking/") || b.startsWith("break/")) {
                return "breaking";
              }
              if (b.startsWith("feat/") || b.startsWith("feature/")) {
                return "enhancement";
              }
              if (b.startsWith("fix/") || b.startsWith("bug/") || b.startsWith("hotfix/")) {
                return "bug";
              }
              if (
                b.startsWith("chore/") ||
                b.startsWith("docs/") ||
                b.startsWith("ci/") ||
                b.startsWith("test/")
              ) {
                return "chore";
              }
              return null;
            }

            function inferTitle(title) {
              const match = title
                .trim()
                .match(/^(feat|fix|docs|test|ci|chore)(\([^)]*\))?(!)?:/i);
              if (!match) {
                return null;
              }
              if (match[3] === "!") {
                return "breaking";
              }
              const kind = match[1].toLowerCase();
              if (kind === "fix") {
                return "bug";
              }
              if (kind === "feat") {
                return "enhancement";
              }
              return "chore";
            }

            async function typeFromChangedFiles(num) {
              let seen = 0;
              for (let page = 1; page <= 10; page++) {
                const { data } = await retryPrNode(() =>
                  github.rest.pulls.listFiles({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: num,
                    per_page: 100,
                    page,
                  }),
                );
                if (!Array.isArray(data) || data.length === 0) {
                  return seen === 0 ? null : "chore";
                }
                for (const file of data) {
                  seen += 1;
                  const name = String(file.filename || "");
                  if (
                    name === "Project.toml" ||
                    name.startsWith("src/") ||
                    name.startsWith("ext/")
                  ) {
                    return null;
                  }
                }
                if (data.length < 100) {
                  return "chore";
                }
                if (seen >= 1000) {
                  core.info(
                    "Changed-file list is longer than 1000; not inferring chore",
                  );
                  return null;
                }
              }
              return null;
            }
