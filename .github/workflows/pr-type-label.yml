# Require a type label on every PR: bug | enhancement | breaking | chore.
# If missing: unique type on a closing issue (`Fixes #N`) first, else branch prefix
# (`feat/` → enhancement, `fix/` → bug, …). Dependabot is exempt (`dependencies`).
name: Type

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

# Include event.action so labeled/unlabeled (from path Labels) do not
# cancel an in-flight opened/synchronize job that is applying the type.
concurrency:
  group: pr-type-label-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  require-type:
    name: PR label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const login = context.payload.pull_request.user.login;
            if (login === "dependabot[bot]") {
              core.info("Skipping type label check for Dependabot");
              return;
            }

            const required = ["bug", "enhancement", "breaking", "chore"];
            const requiredSet = new Set(required);
            const n = context.issue.number;
            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
            });
            const labels = current.map((l) => l.name);
            let found = labels.filter((name) => requiredSet.has(name));
            if (found.length > 0) {
              core.info(`Type label(s): ${found.join(", ")}`);
              return;
            }

            const fromIssue = await typeFromClosingIssues(n);
            const branch = String(context.payload.pull_request.head.ref || "");
            const inferred = fromIssue !== null ? fromIssue : inferType(branch);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              labels: [inferred],
            });
            if (fromIssue !== null) {
              core.info(`Applied type label "${inferred}" from a closing issue`);
            } else {
              core.info(`Applied type label "${inferred}" from branch "${branch}"`);
            }

            async function typeFromClosingIssues(num) {
              const query = `query($owner: String!, $name: String!, $n: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $n) {
                    closingIssuesReferences(first: 20) {
                      nodes { labels(first: 20) { nodes { name } } }
                    }
                  }
                }
              }`;
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                name: context.repo.repo,
                n: num,
              });
              const nodes =
                result.repository?.pullRequest?.closingIssuesReferences?.nodes ?? [];
              const types = new Set();
              for (const node of nodes) {
                for (const lab of node.labels?.nodes ?? []) {
                  if (requiredSet.has(lab.name) && lab.name !== "breaking") {
                    types.add(lab.name);
                  }
                }
              }
              if (types.size === 1) {
                return [...types][0];
              }
              return null;
            }

            function inferType(ref) {
              const b = ref.toLowerCase();
              if (b.startsWith("breaking/") || b.startsWith("break/")) {
                return "breaking";
              }
              if (b.startsWith("feat/") || b.startsWith("feature/")) {
                return "enhancement";
              }
              if (b.startsWith("fix/") || b.startsWith("bug/") || b.startsWith("hotfix/")) {
                return "bug";
              }
              // Known prefixes, and anything else (demos/, wip/, unprefixed).
              return "chore";
            }
