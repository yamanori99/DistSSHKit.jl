# A main push that raises Project.toml version. Not a PR check.
# Same measure as the CI weekly job. A main run appends bench-data.
# A 1.13 failure on main opens "Compile bench failed". A skipped run does not close it.
# The 1.14-nightly and nightly jobs stay continue-on-error and are not that issue.
name: Compile bench

on:
  push:
    branches:
      - main
    paths:
      - Project.toml

concurrency:
  group: compile-bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cut: ${{ steps.cut.outputs.cut }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version cut
        id: cut
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zeros="$(printf '0%.0s' {1..40})"
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zeros" ]; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE" || true
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "before is unreadable; not a cut"
            echo "cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cut="$(./.github/version-cut.sh "$BEFORE" "$GITHUB_SHA")"
          echo "cut=${cut}" >> "$GITHUB_OUTPUT"

  compile-bench:
    name: Compile bench (1.13, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.13"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.13"
          token: ${{ github.token }}

  compile-bench-nightly:
    name: Compile bench (1.14-nightly, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.14-nightly"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.14-nightly"
          token: ${{ github.token }}

  compile-bench-master:
    name: Compile bench (nightly, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "nightly"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "nightly"
          token: ${{ github.token }}

  notify-bench:
    needs: compile-bench
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify-bench
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.compile-bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/compile-bench-notify.sh
