# A main push of the measured tree. Not a PR check.
# Same measure as the CI weekly job. A main run appends a sample to bench-data
# unless that slot already has this commit on this UTC day.
# The README is rendered after the three slots, and when report.jl changes.
# A 1.13 failure on main opens "Compile bench failed". A skipped run does not close it.
# A docs-only push does not match the paths below, so it does not run this
# workflow and does not close that issue.
# The 1.14-pre and nightly jobs stay continue-on-error and are not that issue.
name: Compile bench

on:
  push:
    branches:
      - main
    paths:
      # Measurement inputs. report.jl, charts.jl, and render.sh stay on
      # Compile bench render: that workflow rebuilds the page and does not measure.
      - "src/**"
      - "bench/compile/measure.jl"
      - "bench/compile/measure.sh"
      - "bench/compile/commands.toml"
      - "bench/compile/fixtures/**"
      - "Project.toml"
      - ".github/actions/compile-bench/**"
      - ".github/workflows/compile-bench.yml"

concurrency:
  group: compile-bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compile-bench:
    name: Compile bench (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.13"
          token: ${{ github.token }}

  compile-bench-1-14-pre:
    name: Compile bench (1.14-pre, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "~1.14.0-0"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.14-pre"
          token: ${{ github.token }}

  compile-bench-master:
    name: Compile bench (nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "nightly"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "nightly"
          token: ${{ github.token }}

  render:
    name: Render bench-data
    needs:
      - compile-bench
      - compile-bench-1-14-pre
      - compile-bench-master
    if: always() && github.ref == 'refs/heads/main'
    # Same queue as Deploy docs. Both jobs push gh-pages.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
      # actionlint 1.7.12 does not know concurrency.queue yet. GitHub does.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - name: Render
        env:
          BENCH_TOKEN: ${{ github.token }}
          BENCH_PUSH: "1"
        run: bash .github/compile-bench-render.sh

  notify-bench:
    needs: compile-bench
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify-bench
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.compile-bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/compile-bench-notify.sh
