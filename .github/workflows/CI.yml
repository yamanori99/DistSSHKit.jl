name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  id-token: write # Codecov OIDC upload (see Upload coverage step)

jobs:
  # Full `Pkg.test()` stays Linux-only. Slow SSH E2E controllers are `E2E daily`.
  # PRs run `E2E / ubuntu-latest → ubuntu-24.04`.
  # Root-markdown PRs skip these jobs (Skipped, not a green pass). Required
  # check names must be literal: skipped matrix jobs do not expand ${{ matrix.* }}.
  filter:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect

  test-1-10:
    needs: filter
    if: needs.filter.outputs.heavy == 'true'
    name: Pkg.test - Julia 1.10 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pkg-test
        with:
          version: "1.10"

  test-1-11:
    needs: filter
    if: needs.filter.outputs.heavy == 'true'
    name: Pkg.test - Julia 1.11 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pkg-test
        with:
          version: "1.11"

  test-1-12:
    needs: filter
    if: needs.filter.outputs.heavy == 'true'
    name: Pkg.test - Julia 1.12 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pkg-test
        with:
          version: "1.12"
          coverage: "true"

  test-1-13:
    needs: filter
    if: needs.filter.outputs.heavy == 'true'
    name: Pkg.test - Julia 1.13 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pkg-test
        with:
          # Prerelease channel; ~1.13.0-0 picks the latest 1.13.x (including RCs).
          version: "~1.13.0-0"
