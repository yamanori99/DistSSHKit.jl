name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches

jobs:
  # Full `Pkg.test()` stays Linux-only. Slow SSH E2E controllers are `E2E daily`.
  # PRs run `E2E / ubuntu-latest → ubuntu-24.04`.
  # Detect runs in each job (no `needs` hop). Docs-only PRs skip Pkg.test steps.
  # Required check names are slot literals (min/max), not Julia versions.
  # Codecov (flag pkgtest): main push, max slot only — not on pull_request.
  test-min:
    name: Pkg.test - min - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: min
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
      - uses: ./.github/actions/pkg-test
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'

  test-max:
    name: Pkg.test - max - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: max
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
      - uses: ./.github/actions/pkg-test
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          upload: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  test-tip:
    name: Pkg.test - tip - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: tip
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
      - uses: ./.github/actions/pkg-test
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
