name: Test

on:
  push:
    branches:
      - main
  pull_request:
    # labeled: cut added after open must start test-registry-tree (default types omit it).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches

jobs:
  # Full `Pkg.test()` stays Linux-only. Slow SSH E2E controllers are `E2E weekly`.
  # PRs run `E2E / ubuntu-latest → ubuntu-24.04`.
  # Detect runs in each job (no `needs` hop). Docs-only PRs skip Pkg.test steps.
  # Required check names are slot literals (min/max), not Julia versions.
  # Codecov (flag pkgtest): main push, max slot only — not on pull_request.
  # cache-scratchspaces: false — registry_updates.toml in scratchspaces can
  # poison Pkg.Registry.update on 1.13 if restored corrupt.
  test-min:
    name: Pkg.test - min - ubuntu-latest
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: min
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - uses: ./.github/actions/pkg-test
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'

  test-max:
    name: Pkg.test - max - ubuntu-latest
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: max
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - uses: ./.github/actions/pkg-test
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          upload: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  test-tip:
    name: Pkg.test - tip - ubuntu-latest
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: tip
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - uses: ./.github/actions/pkg-test
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'

  # Not a Julia slot. Not required to merge. Catches checkout-only Pkg.test assumptions.
  test-registry-tree:
    name: Pkg.test - registry tree - ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled'
        && contains(github.event.pull_request.labels.*.name, 'cut'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: tip
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - name: Pkg.test on a Registry-style tree
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y openssh-client
          if command -v ssh >/dev/null; then
            echo "ssh still on PATH" >&2
            exit 1
          fi
          command -v git >/dev/null
          WORKDIR="$(mktemp -d "${HOME}/dsk.XXXXXX")"
          BARE="$(mktemp -d "${HOME}/dsk.git.XXXXXX")"
          rsync -a \
            --exclude .git \
            --exclude Manifest.toml \
            --exclude docs/Manifest.toml \
            --exclude docs/build \
            --exclude test/artifacts \
            ./ "${WORKDIR}/"
          git init --bare -q "${BARE}"
          git --git-dir="${BARE}" --work-tree="${WORKDIR}" add -A
          git --git-dir="${BARE}" --work-tree="${WORKDIR}" \
            -c user.email=ci@distsshkit -c user.name=ci commit -q -m tree
          julia -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.add(; url=ARGS[1])
            using DistSSHKit
            run(Cmd(["chmod", "-R", "a-w", pkgdir(DistSSHKit)]))
            Pkg.test("DistSSHKit")
          ' "file://${BARE}"
