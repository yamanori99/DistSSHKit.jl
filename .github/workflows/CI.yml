name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
# A Project.toml version increase (see version-cut.sh) runs tip /
# Aqua tip / registry tree in this workflow. No label is involved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  # `Pkg.test` 1.13 runs on ubuntu-latest and macos-latest. The macOS job
  # is not a required check and does not upload coverage. SSH E2E lives in
  # DistSSHRun and DistSSHQueue, not this repo.
  # One detect job; markdown-only / allowlisted PRs skip heavy jobs (UI: skipping).
  # Required check names do not include a Julia version.
  # Codecov (flag pkgtest): main push, Ubuntu 1.13 only — not macos-latest,
  # not on pull_request.
  # cache-scratchspaces: false — registry_updates.toml in scratchspaces can
  # poison Pkg.Registry.update on 1.13 if restored corrupt.
  # Aqua / JETLS share this workflow so the Test badge is the PR gate.
  # JETLS uses `.github/actions/jetls-check` (no nested
  # cache; julia-actions/cache#236). JETLS runs on 1.13. Add another version
  # job only when that runtime is outside JETLS's range.
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
      version_cut: ${{ steps.heavy.outputs.version_cut }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-heavy
        id: heavy

  test:
    name: Pkg.test - 1.13 - ubuntu-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          upload: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  test-macos:
    name: Pkg.test - 1.13 - macos-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-tip:
    name: Pkg.test - 1.14-nightly - ubuntu-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  # Not a Julia slot. Not required to merge. Catches checkout-only Pkg.test assumptions.
  test-registry-tree:
    name: Pkg.test - registry tree - ubuntu-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/registry-tree-test

  aqua:
    name: Aqua - 1.13 - ubuntu-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-tip:
    name: Aqua - 1.14-nightly - ubuntu-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  # Literal name: a skipped job must still be this string.
  # 1.13 only. Add another job when JETLS does not list that version.
  jetls:
    name: JETLS - 1.13 - ubuntu-latest
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}
