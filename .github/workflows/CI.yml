name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  id-token: write # Codecov OIDC upload (see Upload coverage step)

jobs:
  # Job names are fixed before steps run. Resolve majors.minor from the same
  # versions.json + semver rules as julia-actions/setup-julia, then use that
  # in `name:` so checks stay `Test / Julia 1.12` even if the spec is `"1"`.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    name: resolve Julia
    outputs:
      compat: ${{ steps.resolve.outputs.compat }}
      test: ${{ steps.resolve.outputs.test }}
      boot_minor: ${{ steps.resolve.outputs.boot_minor }}
    steps:
      - name: Resolve channel minors
        id: resolve
        working-directory: ${{ runner.temp }}
        run: |
          npm install --silent semver@7
          node <<'NODE'
          const fs = require('fs');
          const semver = require('semver');

          const LTS_VERSION = '1.10';
          const MAJOR_VERSION = '1';

          async function main() {
            const res = await fetch('https://julialang-s3.julialang.org/bin/versions.json');
            if (!res.ok) throw new Error(`versions.json HTTP ${res.status}`);
            const available = Object.keys(await res.json());

            function getJuliaVersion(versionInput, includePrerelease = false) {
              let version;
              if (versionInput === 'lts') {
                version = semver.maxSatisfying(available, LTS_VERSION, { includePrerelease: false });
              } else if (versionInput === 'pre') {
                version = semver.maxSatisfying(available, MAJOR_VERSION, { includePrerelease: true });
              } else {
                version = semver.maxSatisfying(available, versionInput, { includePrerelease });
              }
              if (!version) throw new Error(`no Julia release matches ${versionInput}`);
              return String(version).replace(/^v/, '');
            }

            function minorOf(full) {
              const p = semver.parse(full);
              if (!p) throw new Error(`unparseable ${full}`);
              return `${p.major}.${p.minor}`;
            }

            const channels = [
              { spec: '1.10', includePrerelease: false, group: 'compat', coverage: false },
              { spec: '1.11', includePrerelease: false, group: 'compat', coverage: false },
              { spec: '1.12', includePrerelease: false, group: 'test', coverage: true, boot: true },
              // Prerelease channel; ~1.13.0-0 matches latest 1.13.x including RCs.
              { spec: '~1.13.0-0', includePrerelease: true, group: 'test', coverage: false },
            ];

            const resolved = channels.map((c) => {
              const full = getJuliaVersion(c.spec, c.includePrerelease);
              return {
                spec: c.spec,
                full,
                minor: minorOf(full),
                coverage: c.coverage,
                group: c.group,
                boot: Boolean(c.boot),
              };
            });

            const minors = resolved.map((r) => r.minor);
            if (new Set(minors).size !== minors.length) {
              throw new Error(`duplicate resolved minors: ${minors.join(', ')}`);
            }

            const boot = resolved.find((r) => r.boot);
            if (!boot) throw new Error('no boot channel');

            const compat = { include: resolved.filter((r) => r.group === 'compat') };
            const test = { include: resolved.filter((r) => r.group === 'test') };
            for (const row of resolved) {
              console.log(`${row.spec} -> ${row.full} (Julia ${row.minor})`);
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `compat=${JSON.stringify(compat)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `test=${JSON.stringify(test)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `boot_minor=${boot.minor}\n`);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

  # Cheap load + `--help` on macOS/Windows after merge (and on dispatch).
  # Full `Pkg.test()` stays Linux-only; PRs do not wait on macOS/Windows runners.
  boot-macos:
    if: github.event_name != 'pull_request'
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 15
    name: boot macOS · Julia ${{ needs.resolve.outputs.boot_minor }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: "1.12"
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        run: julia --version
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Load package
        run: julia --project=. -e "using DistSSHKit"
      - name: CLI help
        run: |
          julia --project=. -m DistSSHKit -h
          julia --project=. -m DistSSHKit drive -h
          julia --project=. -m DistSSHKit go -h
          julia --project=. -m DistSSHKit setup -h
          julia --project=. -m DistSSHKit size -h

  boot-windows:
    if: github.event_name != 'pull_request'
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 15
    name: boot Windows · Julia ${{ needs.resolve.outputs.boot_minor }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: "1.12"
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        run: julia --version
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Load package
        run: julia --project=. -e "using DistSSHKit"
      - name: CLI help
        run: |
          julia --project=. -m DistSSHKit -h
          julia --project=. -m DistSSHKit drive -h
          julia --project=. -m DistSSHKit go -h
          julia --project=. -m DistSSHKit setup -h
          julia --project=. -m DistSSHKit size -h

  # Load + `main(["-h"])` on 1.10/1.11. Full `Pkg.test()` / `-m` stay on 1.12+.
  compat:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.compat) }}
    name: Julia ${{ matrix.minor }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: ${{ matrix.spec }}
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        run: julia --version
      - name: using + main -h
        run: |
          julia -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.develop(path=".")
            using DistSSHKit
            DistSSHKit.main(["-h"]) == 0 || error("main -h")
          '

  test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Julia ${{ matrix.minor }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.test) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: ${{ matrix.spec }}
      - name: Julia ${{ steps.julia.outputs.julia-version }}
        run: julia --version
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      # Public: OIDC. Private: upload fails quietly until the repo is public.
      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true
          fail_ci_if_error: false
      - name: Coverage summary
        if: matrix.coverage
        run: |
          julia --color=no -e '
          using Pkg
          Pkg.add("Coverage")
          using Coverage, Printf
          files = process_folder("src")
          for fc in files
              c, t = get_summary(fc)
              t == 0 && continue
              @printf("%-32s %5.1f%%\n", basename(fc.filename), 100 * c / t)
          end
          c, t = get_summary(files)
          @printf("%-32s %5.1f%%  (%d/%d lines)\n", "TOTAL", 100 * c / t, c, t)
          '
