name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: jetls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches (not nested in JETLS)

jobs:
  # Literal names: skipped matrix jobs leave ${{ matrix.* }} unexpanded.
  # Ceiling is JULIA_SLOT_JETLS_MAX (JETLS 1.12.2–1.13), not slot max/tip.
  jetls-min:
    name: JETLS - min - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - id: files
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: min
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - uses: ./.github/actions/jetls-check
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          files: ${{ steps.files.outputs.list }}

  jetls-max:
    name: JETLS - max - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect
      - id: files
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          slot: jetls-max
      - uses: julia-actions/cache@v3
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          cache-scratchspaces: false
      - uses: ./.github/actions/jetls-check
        if: github.event_name != 'pull_request' || steps.detect.outputs.heavy == 'true'
        with:
          files: ${{ steps.files.outputs.list }}
