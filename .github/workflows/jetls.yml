name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: jetls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  filter:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect

  jetls:
    needs: filter
    name: JETLS - Julia ${{ matrix.minor }} - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: "1.12"
            minor: "1.12"
          # Same 1.13 channel as Pkg.test (includes RCs until 1.13 is stable).
          - spec: "~1.13.0-0"
            minor: "1.13"
    steps:
      - name: Skip
        if: needs.filter.outputs.heavy != 'true'
        run: echo "Root markdown only; JETLS skipped."
      - uses: actions/checkout@v7
        if: needs.filter.outputs.heavy == 'true'
      - id: files
        if: needs.filter.outputs.heavy == 'true'
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      # Official check action: https://aviatesk.github.io/JETLS.jl/dev/cli-check/#cli-check/github-actions
      # Supported runtimes: Julia 1.12.2–1.13. Action default julia-version is 1.12.
      - uses: aviatesk/JETLS.jl/.github/actions/check@release
        if: needs.filter.outputs.heavy == 'true'
        with:
          files: ${{ steps.files.outputs.list }}
          julia-version: ${{ matrix.spec }}
          exit-severity: hint
          progress: none
