name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: jetls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  filter:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect

  jetls:
    needs: filter
    name: JETLS - Julia 1.13 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip
        if: needs.filter.outputs.heavy != 'true'
        run: echo "Root markdown only; JETLS skipped."
      - uses: actions/checkout@v7
        if: needs.filter.outputs.heavy == 'true'
      - id: files
        if: needs.filter.outputs.heavy == 'true'
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      # Official check action: https://aviatesk.github.io/JETLS.jl/dev/cli-check/#cli-check/github-actions
      # julia-version default is 1.12; 1.13 is supported (1.12.2–1.13). Same channel as Pkg.test.
      - uses: aviatesk/JETLS.jl/.github/actions/check@release
        if: needs.filter.outputs.heavy == 'true'
        with:
          files: ${{ steps.files.outputs.list }}
          julia-version: "~1.13.0-0"
          exit-severity: hint
          progress: none
