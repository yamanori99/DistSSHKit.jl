name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: jetls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  filter:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-heavy
        id: detect

  jetls:
    needs: filter
    name: JETLS - Julia 1.12 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip
        if: needs.filter.outputs.heavy != 'true'
        run: echo "Root markdown only; JETLS skipped."
      - uses: actions/checkout@v7
        if: needs.filter.outputs.heavy == 'true'
      - uses: julia-actions/setup-julia@v3
        if: needs.filter.outputs.heavy == 'true'
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        if: needs.filter.outputs.heavy == 'true'
      - name: Install jetls
        if: needs.filter.outputs.heavy == 'true'
        run: |
          if [ -x "$HOME/.julia/bin/jetls" ]; then
            echo "jetls already installed (Julia cache hit)"
          else
            julia --startup-file=no -e '
              using Pkg
              Pkg.Registry.add("General")
              Pkg.Apps.add(url="https://github.com/aviatesk/JETLS.jl", rev="release")'
          fi
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: jetls check
        if: needs.filter.outputs.heavy == 'true'
        run: |
          # Fail on warning/error. Info alone does not fail; still annotate + Summary.
          set +e
          ./.github/jetls-check.sh --progress=none \
            2>&1 | tee jetls.out
          status=${PIPESTATUS[0]}
          set -e

          if grep -qE 'Found [1-9][0-9]* diagnostic' jetls.out; then
            echo "::warning::JETLS reported diagnostics (see job Summary). Job fails on warning/error; info alone does not fail. Aim for zero diagnostics."
            {
              echo "## JETLS diagnostics"
              echo
              if [ "$status" -ne 0 ]; then
                echo 'Job **failed** (`--exit-severity=warning`: warning or error present).'
              else
                echo 'Job **passed** with info-only diagnostics (non-blocking). Prefer clearing these too.'
              fi
              echo
              echo '```'
              cat jetls.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## JETLS"
              echo
              echo "No diagnostics found."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"
