name: Enhancement
description: New feature or improvement request.
title: "[enhancement] "
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: What do you want?
      description: Problem or goal, and a sketch of the desired behavior.
      placeholder: I want to … so that …
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes (optional)
      description: Alternatives considered, API sketch, related PRs.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area (optional)
      description: Same vocabulary as PR path labels. Add matching area:* labels after submit if useful.
      multiple: true
      options:
        - ci
        - demos
        - docs
        - drive
        - explain
        - go
        - kit
        - project-docs
        - setup
        - size
        - test
    validations:
      required: false
