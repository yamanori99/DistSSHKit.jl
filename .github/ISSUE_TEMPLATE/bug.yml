name: Bug
description: Something is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual, and any error text.
      placeholder: When I run … I expected … but …
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce? (optional)
      description: Commands, script path, Julia version, local vs remote.
      placeholder: |
        julia --project=. -m DistSSHKit drive local:2 demos/with_kit/square_file.jl
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area (optional)
      description: Same vocabulary as PR path labels. Add matching area:* labels after submit if useful.
      multiple: true
      options:
        - ci
        - demos
        - docs
        - drive
        - explain
        - go
        - kit
        - setup
        - size
        - test
    validations:
      required: false
