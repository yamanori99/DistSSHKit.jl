# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: pkg-test
description: Pkg.test after the caller has run setup-julia and julia-actions/cache

inputs:
  coverage:
    description: "true to run coverage + Codecov"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Do not put julia-actions/cache here. Nested composite makes delete-old-caches
    # fail (julia-actions/cache#236) and fills the 10 GB Actions cache quota.
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-runtest@v1
      with:
        coverage: ${{ inputs.coverage }}
    - uses: julia-actions/julia-processcoverage@v1
      if: inputs.coverage == 'true'
    # Public repo + OIDC. A failed upload fails the job (no silent green).
    - name: Upload coverage to Codecov
      if: inputs.coverage == 'true'
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        slug: ${{ github.repository }}
        use_oidc: true
        flags: pkgtest
        fail_ci_if_error: true
    - name: Coverage summary
      if: inputs.coverage == 'true'
      shell: bash
      run: |
        julia --color=no -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage, Printf
        files = process_folder("src")
        for fc in files
            c, t = get_summary(fc)
            t == 0 && continue
            @printf("%-32s %5.1f%%\n", basename(fc.filename), 100 * c / t)
        end
        c, t = get_summary(files)
        @printf("%-32s %5.1f%%  (%d/%d lines)\n", "TOTAL", 100 * c / t, c, t)
        '
