# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: pkg-test
description: Pkg.test for one Julia version (caller sets the check name)

inputs:
  version:
    description: setup-julia version spec
    required: true
  coverage:
    description: "true to run coverage + Codecov"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: julia-actions/setup-julia@v3
      id: julia
      with:
        version: ${{ inputs.version }}
    - name: Julia ${{ steps.julia.outputs.julia-version }}
      shell: bash
      run: julia --version
    - uses: julia-actions/cache@v3
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-runtest@v1
      with:
        coverage: ${{ inputs.coverage }}
    - uses: julia-actions/julia-processcoverage@v1
      if: inputs.coverage == 'true'
    # Public: OIDC. Private: upload fails quietly until the repo is public.
    - name: Upload coverage to Codecov
      if: inputs.coverage == 'true'
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        slug: ${{ github.repository }}
        use_oidc: true
        fail_ci_if_error: false
    - name: Coverage summary
      if: inputs.coverage == 'true'
      shell: bash
      run: |
        julia --color=no -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage, Printf
        files = process_folder("src")
        for fc in files
            c, t = get_summary(fc)
            t == 0 && continue
            @printf("%-32s %5.1f%%\n", basename(fc.filename), 100 * c / t)
        end
        c, t = get_summary(files)
        @printf("%-32s %5.1f%%  (%d/%d lines)\n", "TOTAL", 100 * c / t, c, t)
        '
