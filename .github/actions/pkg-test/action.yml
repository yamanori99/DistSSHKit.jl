# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: pkg-test
description: Pkg.test after the caller has run setup-julia and julia-actions/cache

inputs:
  coverage:
    description: "true to run coverage + Codecov"
    required: false
    default: "false"
  heap_size_hint:
    description: "If set (e.g. 2G), pass --heap-size-hint to the Pkg.test process"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Do not put julia-actions/cache here. Nested composite makes delete-old-caches
    # fail (julia-actions/cache#236) and fills the 10 GB Actions cache quota.
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-runtest@v1
      if: inputs.heap_size_hint == ''
      with:
        coverage: ${{ inputs.coverage }}
    # julia-runtest has no extra julia_args. Hint makes 1.10/1.11 GC before GHA OOM.
    - name: Pkg.test with heap-size-hint
      if: inputs.heap_size_hint != ''
      shell: bash
      env:
        HEAP_SIZE_HINT: ${{ inputs.heap_size_hint }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        julia --color=yes --project=@. -e '
          using Pkg
          hint = ENV["HEAP_SIZE_HINT"]
          cov = ENV["COVERAGE"] == "true"
          Pkg.test(;
            coverage=cov,
            julia_args=[
              "--heap-size-hint=$(hint)",
              "--check-bounds=yes",
              "--compiled-modules=yes",
              "--depwarn=yes",
            ],
          )
        '
    - uses: julia-actions/julia-processcoverage@v1
      if: inputs.coverage == 'true'
    # Public repo + OIDC. A failed upload fails the job (no silent green).
    - name: Upload coverage to Codecov
      if: inputs.coverage == 'true'
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        slug: ${{ github.repository }}
        use_oidc: true
        flags: pkgtest
        fail_ci_if_error: true
    - name: Coverage summary
      if: inputs.coverage == 'true'
      shell: bash
      run: |
        julia --color=no -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage, Printf
        files = process_folder("src")
        for fc in files
            c, t = get_summary(fc)
            t == 0 && continue
            @printf("%-32s %5.1f%%\n", basename(fc.filename), 100 * c / t)
        end
        c, t = get_summary(files)
        @printf("%-32s %5.1f%%  (%d/%d lines)\n", "TOTAL", 100 * c / t, c, t)
        '
