# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: pkg-test
description: Pkg.test after the caller has run setup-julia and julia-actions/cache

inputs:
  coverage:
    description: "true to instrument Pkg.test and write lcov.info"
    required: false
    default: "false"
  upload:
    description: "true to upload lcov.info to Codecov (requires coverage)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Do not put julia-actions/cache here. Nested composite makes delete-old-caches
    # fail (julia-actions/cache#236) and fills the 10 GB Actions cache quota.
    - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
    - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
      with:
        coverage: ${{ inputs.coverage }}
    - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      if: inputs.coverage == 'true'
    # Public repo + OIDC. A failed upload fails the job (no silent green).
    - name: Upload coverage to Codecov
      if: inputs.upload == 'true'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: lcov.info
        slug: ${{ github.repository }}
        use_oidc: true
        flags: pkgtest
        fail_ci_if_error: true
    - name: Coverage summary
      if: inputs.upload == 'true'
      shell: bash
      run: |
        julia --color=no -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage, Printf
        files = process_folder("src")
        for fc in files
            c, t = get_summary(fc)
            t == 0 && continue
            @printf("%-32s %5.1f%%\n", basename(fc.filename), 100 * c / t)
        end
        c, t = get_summary(files)
        @printf("%-32s %5.1f%%  (%d/%d lines)\n", "TOTAL", 100 * c / t, c, t)
        '
