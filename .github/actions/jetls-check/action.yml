# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: jetls-check
description: Install JETLS app and run jetls check (caller must setup-julia + julia-actions/cache)

inputs:
  files:
    description: Space-separated Julia files for jetls check
    required: true

runs:
  using: composite
  steps:
    # Do not call julia-actions/cache here (julia-actions/cache#236).
    # That action restores packages/ and compiled/, not environments/apps or bin/.
    # actions/cache below is only the app env and the jetls shim.
    # Official aviatesk/JETLS.jl check@release nests cache with no opt-out.
    - name: JETLS app cache key
      id: jetls-key
      shell: bash
      run: |
        set -euo pipefail
        ver="$(julia --startup-file=no -e 'print(VERSION)')"
        rev="$(grep -E -m 1 -o 'rev="[0-9]{4}-[0-9]{2}-[0-9]{2}"' "${GITHUB_ACTION_PATH}/action.yml" || true)"
        rev="${rev#rev=\"}"
        rev="${rev%\"}"
        if [[ ! "${rev}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "jetls-check: date pin missing in ${GITHUB_ACTION_PATH}/action.yml" >&2
          exit 1
        fi
        echo "julia=${ver}" >> "${GITHUB_OUTPUT}"
        echo "rev=${rev}" >> "${GITHUB_OUTPUT}"
        echo "jetls-startup: cache key jetls-app-${RUNNER_OS}-${ver}-${rev}"
    - name: Restore JETLS app
      id: jetls-app
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.julia/environments/apps/JETLS
          ~/.julia/environments/apps/AppManifest.toml
          ~/.julia/bin/jetls
        key: jetls-app-${{ runner.os }}-${{ steps.jetls-key.outputs.julia }}-${{ steps.jetls-key.outputs.rev }}
    - name: Install jetls
      shell: bash
      env:
        JETLS_APP_CACHE: ${{ steps.jetls-app.outputs.cache-hit }}
      run: | # zizmor: ignore[github-env] constant "$HOME/.julia/bin", not attacker input
        set -euo pipefail
        mkdir -p "$HOME/.julia/bin"
        echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.julia/bin:$PATH"
        if [[ -z "${JULIA_APPS_JULIA_CMD:-}" ]]; then
          export JULIA_APPS_JULIA_CMD="$(command -v julia)"
        fi
        # `release` moves. A new hint then fails weekly on unchanged code.
        # This tag is that date release. Bump it to take a newer JETLS.
        # Pkg.Apps.add deletes and rewrites the app env, and fetches the git
        # repo, even when the depot cache already has the packages. Skip that
        # when this rev and Julia are already restored.
        if [[ "${JETLS_APP_CACHE}" == "true" && -x "${HOME}/.julia/bin/jetls" && -f "${HOME}/.julia/environments/apps/JETLS/Manifest.toml" ]]; then
          if jetls version; then
            echo "jetls-startup: app cache hit; skip Pkg.Apps.add"
            exit 0
          fi
          echo "jetls-startup: app cache hit but jetls version failed; installing"
        else
          echo "jetls-startup: app cache miss; Pkg.Apps.add"
        fi
        julia --startup-file=no -e '
          using Pkg
          Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="2026-10-26")
        '
    - name: Run jetls check
      shell: bash
      env:
        JETLS_FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        export PATH="$HOME/.julia/bin:$PATH"
        if [[ -z "${JULIA_APPS_JULIA_CMD:-}" ]]; then
          export JULIA_APPS_JULIA_CMD="$(command -v julia)"
        fi
        echo "jetls-startup: check begin"
        jetls version
        echo "jetls-startup: version done"
        manifest="${HOME}/.julia/environments/apps/JETLS/Manifest.toml"
        if [[ -f "$manifest" ]]; then
          # The date tag does not name the analyzer. JETLSCore repo-rev does.
          core="$(awk '
            /^\[\[deps\.JETLSCore\]\]$/ { section = "core"; next }
            /^\[\[/ { section = ""; next }
            section == "core" && $1 == "repo-rev" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' "$manifest")"
          echo "jetls core ${core}"
        fi
        # Match aviatesk/JETLS.jl check@release: no `--threads=auto` (segfaults
        # on Julia 1.13 in signature_analysis_worker; exit 139).
        # shellcheck disable=SC2086
        jetls check --quiet --root=. --exit-severity=hint --show-severity=hint --progress=none $JETLS_FILES
        echo "jetls-startup: check end"
