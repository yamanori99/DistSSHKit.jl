# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: ci-heavy
description: Whether Pkg.test / JETLS / Aqua and Documenter should run

outputs:
  heavy:
    description: true when Pkg.test / JETLS / Aqua should run
    value: ${{ steps.out.outputs.heavy }}
  docs:
    description: true when Documenter should run
    value: ${{ steps.out.outputs.docs }}
  version_cut:
    description: true when this PR raises Project.toml version
    value: ${{ steps.version.outputs.cut }}

runs:
  using: composite
  steps:
    # v3 only allows `some` / `every`. `some` ignores `!` after `**`.
    # `some-with-excludes` is v4 (Node 24).
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      if: github.event_name == 'pull_request'
      id: filter
      with:
        predicate-quantifier: some-with-excludes
        # Named skip files only. A new root `*.md` stays heavy until listed here.
        filters: |
          heavy:
            - "**"
            - "!README.md"
            - "!README.ja.md"
            - "!CONTRIBUTING.md"
            - "!NEWS.md"
            - "!HISTORY.md"
            - "!SECURITY.md"
            - "!LICENSE"
            - "!.gitignore"
            - "!.git-blame-ignore-revs"
            - "!.github/pull_request_template.md"
            - "!.coderabbit.yaml"
            - "!docs/**"
            - "!test/**/*.md"
          docs:
            - "docs/**"
            - "README.md"
            - "README.ja.md"
            - "src/**"
            - "Project.toml"
    - id: version
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
          echo "cut=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        cut="$(./.github/version-cut.sh "$BASE" "$HEAD")"
        echo "cut=${cut}" >> "$GITHUB_OUTPUT"
    - id: release
      if: github.event_name == 'push'
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        zeros="$(printf '0%.0s' {1..40})"
        only=false
        if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zeros" ]; then
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE" || true
          fi
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            cut="$(./.github/version-cut.sh "$BEFORE" "$GITHUB_SHA")"
            names="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            if [ "$cut" = "true" ] && [ -n "$names" ]; then
              only=true
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  Project.toml|NEWS.md) ;;
                  *) only=false ;;
                esac
              done <<<"$names"
            fi
          fi
        fi
        echo "only=${only}" >> "$GITHUB_OUTPUT"
        echo "release-only=${only}"
    - id: out
      shell: bash
      env:
        HEAVY: ${{ steps.filter.outputs.heavy }}
        DOCS: ${{ steps.filter.outputs.docs }}
        # Project.toml version went up. Path skips do not apply.
        CUT: ${{ steps.version.outputs.cut }}
        RELEASE_ONLY: ${{ steps.release.outputs.only }}
      run: |
        if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
          if [ "${RELEASE_ONLY}" = "true" ]; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "release-only push: heavy=false docs=true"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "non-PR: heavy=true docs=true"
          fi
        elif [ "${CUT}" = "true" ]; then
          echo "heavy=true" >> "$GITHUB_OUTPUT"
          echo "docs=true" >> "$GITHUB_OUTPUT"
          echo "PR version cut: heavy=true docs=true"
        else
          echo "heavy=${HEAVY}" >> "$GITHUB_OUTPUT"
          echo "docs=${DOCS}" >> "$GITHUB_OUTPUT"
          echo "PR: heavy=${HEAVY} docs=${DOCS}"
        fi
