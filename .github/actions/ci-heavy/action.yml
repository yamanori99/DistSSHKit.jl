# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: ci-heavy
description: Whether Pkg.test / JETLS / Aqua / Documenter should run

outputs:
  heavy:
    description: true when heavy CI should run
    value: ${{ steps.out.outputs.heavy }}

runs:
  using: composite
  steps:
    # v3 only allows `some` / `every`. `some` ignores `!` after `**`.
    # `some-with-excludes` is v4 (Node 24).
    - uses: dorny/paths-filter@v4
      if: github.event_name == 'pull_request'
      id: filter
      with:
        predicate-quantifier: some-with-excludes
        # Named skip files only. A new root `*.md` stays heavy until listed here.
        filters: |
          heavy:
            - "**"
            - "!README.md"
            - "!CONTRIBUTING.md"
            - "!NEWS.md"
            - "!SECURITY.md"
            - "!LICENSE"
            - "!.gitignore"
            - "!.github/pull_request_template.md"
    - id: out
      shell: bash
      env:
        HEAVY: ${{ steps.filter.outputs.heavy }}
        # Exact name `cut` (version bump). Path skips do not apply.
        CUT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'cut') }}
      run: |
        if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
          echo "heavy=true" >> "$GITHUB_OUTPUT"
          echo "non-PR: heavy=true"
        elif [ "${CUT}" = "true" ]; then
          echo "heavy=true" >> "$GITHUB_OUTPUT"
          echo "PR cut: heavy=true"
        else
          echo "heavy=${HEAVY}" >> "$GITHUB_OUTPUT"
          echo "PR: heavy=${HEAVY}"
        fi
