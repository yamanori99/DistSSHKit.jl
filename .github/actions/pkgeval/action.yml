# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: pkgeval
description: Evaluate this package in PkgEval's sandbox against a Julia build

inputs:
  package:
    description: Package name. The checkout root is mounted read-only at /package.
    required: true
  julia:
    description: Julia build PkgEval tests against. The host Julia is separate.
    required: false
    default: nightly

runs:
  using: composite
  steps:
    - name: Allow unprivileged user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: PkgEval ${{ inputs.package }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PKGEVAL_PACKAGE: ${{ inputs.package }}
        PKGEVAL_JULIA: ${{ inputs.julia }}
      run: |
        set -euo pipefail
        julia --project=@pkgeval -e '
          using Pkg
          Pkg.add("PkgEval")
          using PkgEval
          config = Configuration(; julia=ENV["PKGEVAL_JULIA"])
          pkg = Package(; name=ENV["PKGEVAL_PACKAGE"], url="/package")
          result = PkgEval.evaluate_package(config, pkg; echo=true,
              mounts=Dict("/package:ro" => pwd()))
          println(stderr, "PkgEval status=", result.status, " reason=", result.reason)
          exit(result.status == :test ? 0 : 1)
        '
