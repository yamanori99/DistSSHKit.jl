version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Stdlibs are ignored. Dependabot's Julia updater appends `< 0.0.1`
  # (union with 0.0.0) for the pre-1.10 Pkg.test sandbox. This package
  # is Julia 1.12, so that clause is wrong. Keep Dates / Distributed /
  # Pkg / SHA / TOML / Test pinned to the Julia floor by hand.
  - package-ecosystem: julia
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    allow:
      - dependency-name: ArgParse
      - dependency-name: JSON
      - dependency-name: Documenter
