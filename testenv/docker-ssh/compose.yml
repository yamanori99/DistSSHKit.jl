# Linux SSH children for DistSSHKit CI / local Docker E2E (`child:NAME[:N]`).
services:
  child-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JULIA_DEFAULT_CHANNEL: ${JULIA_DEFAULT_CHANNEL:-1.13}
        JULIA_ALT_CHANNEL: ${JULIA_ALT_CHANNEL:-1.12}
        JULIA_DEFAULT_RELEASE: ${JULIA_DEFAULT_RELEASE:-}
        JULIA_ALT_RELEASE: ${JULIA_ALT_RELEASE:-}
    image: local/linux-ssh-worker:latest
    container_name: child-1
    hostname: child-1
    environment:
      DISTSSHKIT_HOSTNAME: child-1
    ports:
      - "2222:22"
    volumes:
      - ./mounted-keys:/mounted-keys:ro
    restart: "no"

  child-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JULIA_DEFAULT_CHANNEL: ${JULIA_DEFAULT_CHANNEL:-1.13}
        JULIA_ALT_CHANNEL: ${JULIA_ALT_CHANNEL:-1.12}
        JULIA_DEFAULT_RELEASE: ${JULIA_DEFAULT_RELEASE:-}
        JULIA_ALT_RELEASE: ${JULIA_ALT_RELEASE:-}
    image: local/linux-ssh-worker:latest
    container_name: child-2
    hostname: child-2
    environment:
      DISTSSHKIT_HOSTNAME: child-2
    ports:
      - "2223:22"
    volumes:
      - ./mounted-keys:/mounted-keys:ro
    restart: "no"
